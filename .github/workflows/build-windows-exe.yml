name: Build Windows exe
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas matplotlib openpyxl pillow pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name QB-Throw-Speed --add-data "data\throws.xlsx;data" --hidden-import PIL._tkinter_finder app.py
      - uses: actions/upload-artifact@v4
        with:
          name: QB-Throw-Speed
          path: dist/QB-Throw-Speed.exe
